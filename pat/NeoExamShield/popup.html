<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoExamShield</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #FFFFFF;
            color: #0F172A;
            width: 200px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            user-select: none;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 800;
            color: #1686FF;
            margin-bottom: 10px;
            letter-spacing: -0.2px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        #syncCode {
            width: 100%;
            background-color: #F8FAFC;
            border: 1.5px solid #E2E8F0;
            border-radius: 8px;
            padding: 8px 4px;
            font-family: monospace;
            font-size: 1.6rem;
            text-align: center;
            letter-spacing: 6px;
            font-weight: 800;
            color: #0F172A;
            transition: all 0.2s ease;
            outline: none;
        }

        #syncCode:focus {
            border-color: #1686FF;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(22, 134, 255, 0.15);
        }

        #syncAPIConfig {
            background-color: #1686FF;
            color: #FFFFFF;
            border: none;
            padding: 9px;
            border-radius: 8px;
            font-size: 0.825rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        #syncAPIConfig:hover {
            background-color: #0b6edb;
        }

        #syncAPIConfig:disabled {
            background-color: #94A3B8;
            cursor: not-allowed;
        }

        #syncStatus {
            font-size: 0.725rem;
            text-align: center;
            font-weight: 700;
            min-height: 16px;
            margin-top: 6px;
            color: #64748B;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #F1F5F9;
        }

        .footer-link {
            font-size: 0.7rem;
            color: #64748B;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
            transition: color 0.15s ease;
            background: none;
            border: none;
            padding: 2px 4px;
        }

        .footer-link:hover {
            color: #1686FF;
        }

        .footer-link.danger {
            color: #EF4444;
        }

        .footer-link.danger:hover {
            color: #DC2626;
            text-decoration: underline;
        }

        /* Shortcuts Overlay Panel */
        #shortcuts-panel {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #FFFFFF;
            padding: 12px;
            z-index: 99;
            flex-direction: column;
        }

        .shortcuts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #E2E8F0;
        }

        .shortcuts-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: #0F172A;
        }

        #closeShortcuts {
            color: #1686FF;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
        }

        .shortcut-item {
            font-size: 0.7rem;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shortcut-key {
            color: #1686FF;
            font-weight: 800;
            background: #EFF6FF;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-family: monospace;
        }

        .shortcut-desc {
            font-weight: 600;
            color: #475569;
            font-size: 0.7rem;
        }

        #error {
            font-size: 0.7rem;
            color: #EF4444;
            text-align: center;
            margin-top: 4px;
            font-weight: 600;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="header">
        <span>⚡</span> NeoExamShield
    </div>
    
    <div class="input-group">
        <input type="text" id="syncCode" placeholder="000" maxlength="3" autocomplete="off" autofocus>
        <button type="button" id="syncAPIConfig">Sync Keys</button>
    </div>
    
    <div id="syncStatus">Not Linked</div>
    <div id="error" class="hidden"></div>

    <div class="footer-links">
        <button type="button" class="footer-link" id="showShortcuts">Shortcuts</button>
        <button type="button" class="footer-link hidden" id="logoutButton">Logout</button>
        <button type="button" class="footer-link danger" id="uninstallButton">Uninstall</button>
    </div>

    <!-- Shortcuts Panel Overlay -->
    <div id="shortcuts-panel">
        <div class="shortcuts-header">
            <span class="shortcuts-title">Shortcuts</span>
            <button type="button" id="closeShortcuts">✕ Close</button>
        </div>
        <div class="shortcut-item">
            <span class="shortcut-desc">Auto MCQ</span>
            <span class="shortcut-key">Alt + A</span>
        </div>
        <div class="shortcut-item">
            <span class="shortcut-desc">Auto Code</span>
            <span class="shortcut-key">Alt + T</span>
        </div>
        <div class="shortcut-item">
            <span class="shortcut-desc">AI Chatbot</span>
            <span class="shortcut-key">Alt + C</span>
        </div>
        <div class="shortcut-item">
            <span class="shortcut-desc">Force Paste</span>
            <span class="shortcut-key">Alt + P</span>
        </div>
    </div>

    <script src="firebaseConfig.js"></script>
    <script src="popup.js"></script>
</body>
</html>
